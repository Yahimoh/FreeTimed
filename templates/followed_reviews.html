{% extends "base.html" %}
{% block content %}
<h1>Reviews from Users You Follow</h1>
{% for review in reviews %}
  <div class="review-card">
    <strong>{{ review['item_name'] }}</strong>
    <span class="category">{{ review['category'] }}</span>
    <div class="review-text">{{ review['review_text'] }}</div>
    <div class="review-meta">
      by <a href="{{ url_for('profile', user_id=review['user_id']) }}">{{ review['username'] or 'Unknown' }}</a>
    </div>
  </div>
{% endfor %}
<a class="back-link" href="{{ url_for('index') }}">Back to all reviews</a>
{% endblock %}
