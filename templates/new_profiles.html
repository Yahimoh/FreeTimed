{% extends "base.html" %}
{% block content %}
<h1>New Profiles</h1>
<div class="profile-list">
  {% for user in profiles %}
    <a href="{{ url_for('profile', user_id=user['id']) }}">{{ user['username'] }}</a>
  {% endfor %}
</div>
<a class="back-link" href="{{ url_for('index') }}">Back to home</a>
{% endblock %}
