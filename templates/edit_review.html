{% extends "base.html" %}
{% block content %}
<h1>Edit Review</h1>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
  <div class="form-group">
    <label>Item Name</label>
    <input type="text" name="item_name" value="{{ review['item_name'] }}">
  </div>
  <div class="form-group">
    <label>Category</label>
    <select name="category">
      <option value="Music" {% if review['category'] == 'Music' %}selected{% endif %}>Music</option>
      <option value="Movies" {% if review['category'] == 'Movies' %}selected{% endif %}>Movies</option>
      <option value="Series" {% if review['category'] == 'Series' %}selected{% endif %}>Series</option>
      <option value="Videogames" {% if review['category'] == 'Videogames' %}selected{% endif %}>Videogames</option>
    </select>
  </div>
  <div class="form-group">
    <label>Review</label>
    <textarea name="review_text" rows="5">{{ review['review_text'] }}</textarea>
  </div>
  <input type="submit" value="Update Review">
</form>
<a class="back-link" href="{{ url_for('index') }}">Back to reviews</a>
{% endblock %}
